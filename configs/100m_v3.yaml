model:
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 10
  hidden_dim: 2304
  context_length: 512
  dropout: 0.0
training:
  batch_size: 8
  steps: 20000
  learning_rate: 0.0002
  weight_decay: 0.1
  warmup_steps: 1000
  log_every: 100
  checkpoint_every: 500
  eval_every: 500
  eval_samples: 512
  full_eval_every: 0
data:
  train_inputs: /content/drive/MyDrive/Custom-LLM-V2/tokenized_v3/train/inputs
  train_targets: /content/drive/MyDrive/Custom-LLM-V2/tokenized_v3/train/targets
  val_inputs: /content/drive/MyDrive/Custom-LLM-V2/tokenized_v3/validation/inputs
  val_targets: /content/drive/MyDrive/Custom-LLM-V2/tokenized_v3/validation/targets
