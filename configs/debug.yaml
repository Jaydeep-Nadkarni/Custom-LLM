model:
  vocab_size: 32000
  d_model: 384
  n_heads: 6
  n_layers: 6
  hidden_dim: 1024
  context_length: 512
  dropout: 0.0
training:
  batch_size: 8
  steps: 10000
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  log_every: 100
data:
  train_inputs: data/tokenized/fineweb_train_inputs.npy
  train_targets: data/tokenized/fineweb_train_targets.npy