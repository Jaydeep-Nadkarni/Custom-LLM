model:
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 10
  hidden_dim: 2304
  context_length: 512
  dropout: 0.0

training:
  batch_size: 4
  steps: 20000
  learning_rate: 0.0002
  weight_decay: 0.1
  warmup_steps: 1000
  log_every: 100
  checkpoint_every: 500

data:
  train_inputs: data/tokenized/100m/inputs
  train_targets: data/tokenized/100m/targets
